<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoPark - Новая точка</title>
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/index.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <div class="header">
            <div class="header-left">
                <a href="index.html" class="btn-back" style="margin-right: 8px;">
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </a>
                <div class="view-title" data-i18n="newPoint">Новая точка</div>
            </div>
        </div>
        <div class="content" style="display: flex; align-items: center; justify-content: center; padding: 20px;">
            <!-- Модальное окно отображается как основная форма на этой странице -->
            <div class="modal" style="width: 100%; transform: none; border: none; box-shadow: none; padding: 0;">
                <div class="modal-field">
                    <div class="modal-label" data-i18n="name">Название</div>
                    <input type="text" class="modal-input" id="inputName" maxlength="100" data-i18n-placeholder="namePlaceholder" oninput="updateCharCount()">
                    <div class="char-count" id="charCount">0 / 100</div>
                </div>
                <div class="modal-field">
                    <div class="modal-label" data-i18n="address">Адрес</div>
                    <input type="text" class="modal-input" id="inputAddress" data-i18n-placeholder="addressPlaceholder">
                </div>
                <div class="modal-field">
                    <div class="modal-label" data-i18n="searchDistance">Дистанция поиска</div>
                    <div class="distance-value" id="distanceValue">500 м</div>
                    <div class="distance-slider">
                        <div class="distance-track">
                            <div class="distance-fill" id="distanceFill"></div>
                            <div class="distance-dots">
                                <div class="distance-dot active"></div>
                                <div class="distance-dot"></div>
                                <div class="distance-dot"></div>
                                <div class="distance-dot"></div>
                            </div>
                            <div class="distance-thumb" id="distanceThumb"></div>
                        </div>
                        <div class="distance-labels" id="distanceLabels"></div>
                    </div>
                </div>
                <div class="modal-buttons">
                    <a href="index.html" class="btn-modal cancel" style="text-decoration: none; display: flex; align-items: center; justify-content: center;" data-i18n="cancel">Отмена</a>
                    <button class="btn-modal save" id="btnSave" onclick="savePoint()" data-i18n="savePoint">Сохранить точку</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
