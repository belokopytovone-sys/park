<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoPark - Настройки</title>
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/index.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <div class="header">
            <div class="header-left">
                <a href="index.html" class="btn-back" style="margin-right: 8px;">
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </a>
                <div class="view-title" data-i18n="settings">Настройки</div>
            </div>
        </div>
        <div class="content">
            <div class="settings-view visible" id="settingsView">
                <div class="settings-content">
                    <div class="settings-section">
                        <div class="settings-section-title" data-i18n="theme">Тема</div>
                        <div class="settings-option active" data-theme="dark" onclick="setTheme('dark')">
                            <div class="theme-preview dark"></div>
                            <div class="settings-option-label" data-i18n="themeDark">Тёмная</div>
                            <div class="settings-option-check"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                        </div>
                        <div class="settings-option" data-theme="light" onclick="setTheme('light')">
                            <div class="theme-preview light"></div>
                            <div class="settings-option-label" data-i18n="themeLight">Светлая</div>
                            <div class="settings-option-check"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                        </div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-section-title" data-i18n="language">Язык</div>
                        <div id="languageList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
