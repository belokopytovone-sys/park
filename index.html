<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoPark - Главное меню</title>
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.8/index.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone-frame">
        <!-- SPLASH SCREEN -->
        <div class="splash" id="splash">
            <div class="splash-content">
                <div class="splash-glow"></div>
                <div class="splash-title">РиТуИ</div>
                <div class="splash-divider"></div>
                <div class="splash-subtitle">представляет</div>
                <div class="splash-dots">
                    <div class="splash-dot"></div>
                    <div class="splash-dot"></div>
                    <div class="splash-dot"></div>
                </div>
            </div>
            <div class="splash-sponsor">
                <div class="splash-sponsor-text">Спонсировано компанией:</div>
                <img class="splash-sponsor-logo" src="https://upload.wikimedia.org/wikipedia/commons/9/9b/Sberbank_Logo_2020.svg" alt="СберБанк">
            </div>
        </div>

        <div class="header">
            <div class="header-left">
                <div class="header-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                </div>
                <h1>GeoPark</h1>
            </div>
            <div class="header-right">
                <a href="chat.html" class="btn-header btn-support" title="Техподдержка">
                    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 9h-2V5h2v6zm0 4h-2v-2h2v2z"/></svg>
                </a>
                <a href="settings.html" class="btn-header btn-settings" title="Настройки">
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                </a>
            </div>
        </div>

        <div class="content">
            <div class="points-view" id="pointsView">
                <div class="search-bar">
                    <input type="text" class="search-input" id="searchInput" data-i18n-placeholder="search" oninput="onSearchInput()">
                    <div class="search-icon">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </div>
                    <button class="search-clear" id="searchClear" onclick="clearSearch()">
                        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                </div>

                <div class="points-scroll-wrapper">
                    <div class="points-list" id="pointsList">
                        <div class="item current-location" id="currentLocation" onclick="selectCurrent()">
                            <div class="point-indicator current-indicator filled" id="currentIndicator"></div>
                            <div class="item-info">
                                <div class="item-name" data-i18n="currentLocation">Текущее местоположение</div>
                                <div class="item-addr" data-i18n="currentLocationDesc">Ваше текущее положение</div>
                            </div>
                        </div>
                        <div class="empty-state" id="emptyState">
                            <div class="empty-state-icon">
                                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/></svg>
                            </div>
                            <p data-i18n-html="emptyState">Добавьте точки<br>для быстрого доступа</p>
                        </div>
                    </div>
                    <div class="custom-scrollbar" id="customScrollbar">
                        <div class="custom-scrollbar-thumb" id="customScrollbarThumb"></div>
                    </div>
                </div>

                <a href="add-point.html" class="btn-add-point" style="text-decoration: none; display: flex;">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    <span data-i18n="addPoint">Добавить точку</span>
                </a>
            </div>
        </div>

        <div class="footer" id="footer">
            <a href="map.html" class="btn-show" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">
                <span class="btn-ripple"></span><span data-i18n="show">Показать</span>
            </a>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
